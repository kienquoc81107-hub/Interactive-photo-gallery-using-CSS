
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Photo Gallery</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="page2.html">Trang 2</a></li>
            <li><a href="page3.html">Trang 3</a></li>
        </ul>
    </nav>

    <main>
        <div id="image">
            <p>Hover over an image below to display here.</p>
        </div>

        <div class="gallery">
            <img class="thumb"
                 src="https://picsum.photos/id/10/500/350"
                 alt="Rừng cây"
                 onmouseover="upDate(this)"
                 onmouseout="undo()">

            <img class="thumb"
                 src="https://picsum.photos/id/20/500/350"
                 alt="Bàn làm việc"
                 onmouseover="upDate(this)"
                 onmouseout="undo()">

            <img class="thumb"
                 src="https://picsum.photos/id/30/500/350"
                 alt="Bờ biển"
                 onmouseover="upDate(this)"
                 onmouseout="undo()">
        </div>
    </main>

    <footer>
        <p>Photo Gallery - CSS Week 1 Project</p>
    </footer>

    <script>
        const imageDiv = document.getElementById('image');
        const originalText = 'Hover over an image below to display here.';

        function upDate(previewPic) {
            console.log('upDate được gọi');
            console.log('alt:', previewPic.alt);
            console.log('src:', previewPic.src);

            imageDiv.textContent = previewPic.alt;
            imageDiv.style.backgroundImage = `url("${previewPic.src}")`;
        }

        function undo() {
            console.log('undo được gọi');

            imageDiv.style.backgroundImage = '';
            imageDiv.textContent = originalText;
        }
    </script>
</body>
</html>
